# The dongle is a BLE central connecting to 2 peripherals (left + right).
# Zephyr's BT_MAX_CONN/BT_MAX_PAIRED default to 1, which only allows one
# peripheral to stay connected at a time. Bump these so both halves can
# pair and stay connected simultaneously.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
